[project]
name = "agentic-sdlc-pipeline"
version = "0.1.0"
description = "Agentic SDLC pipeline driven by Claude Code (includes the csv_summary tool)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m \"not slow\""
markers = [
    "slow: large-file tests (AC-16); run with `pytest -m slow`",
]

[tool.ruff]
line-length = 88
